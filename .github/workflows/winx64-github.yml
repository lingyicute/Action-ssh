name: Windows RDP Github-runner x64

# 这些 workflow 只需要读代码，显式收窄 GITHUB_TOKEN 权限。
permissions:
  contents: read

on: workflow_dispatch

jobs:
  setup-rdp:
    uses: ./.github/workflows/reusable-windows-rdp.yml
    with:
      runs-on: windows-latest
      runner-user: runneradmin
      timeout-minutes: 360
    secrets: inherit
